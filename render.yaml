# Render Blueprint: free web service for Max Alert (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: max-alert
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: "1"
      - key: SODEXO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
